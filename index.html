<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<!-- iPhoneの「ホーム画面に追加」から全画面アプリとして起動するための設定 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0E1116">
<title>Score Tracker</title>
<style>
  /* ============================================================
     バスケ スコアトラッカー(GitHub Pages公開版)
     Claude Artifact版(v4)と同じ機能を、素のHTML/CSS/JSで実装。
     データ保存は localStorage(この端末のブラウザ内のみ)。
     ============================================================ */
  :root {
    --bg: #0E1116;
    --panel: #171D26;
    --line: #262E3A;
    --text: #EDE8DC;
    --dim: #8A92A0;
    --home: #FFB22E;
    --away: #5BC8F5;
    --danger: #E5604C;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Hiragino Sans','Noto Sans JP',system-ui,sans-serif;
    padding: 12px 12px 32px;
    max-width: 560px;
    margin-inline: auto;
  }
  button { font-family: inherit; cursor: pointer; }
  .title { text-align: center; margin-bottom: 10px; }
  .title-text { font-size: 13px; letter-spacing: .35em; color: var(--dim); font-weight: 700; }
  .wood { height: 4px; border-radius: 2px; margin-top: 6px;
          background: linear-gradient(90deg,#B07A45,#8F5E33 55%,#B07A45); }

  .toprow { display: flex; gap: 8px; margin-bottom: 10px; }
  #clockBtn {
    flex: 1; border-radius: 12px; padding: 10px 8px;
    font-size: 14px; font-weight: 800; border: 1px solid transparent;
    transition: background .15s;
  }
  #clockBtn.start { background: var(--home); color: #1A1205; }
  #clockBtn.running { background: var(--panel); color: var(--home); border-color: var(--home); }
  #clockBtn.confirm { background: var(--danger); color: #fff; }

  .qwrap { display: flex; background: var(--panel); border: 1px solid var(--line);
           border-radius: 12px; overflow: hidden; }
  .qbtn { border: none; background: transparent; color: var(--dim);
          font-weight: 800; font-size: 13px; padding: 0 10px; }
  .qbtn.active { background: var(--text); color: var(--bg); }

  .board { display: flex; gap: 8px; }
  .teamcard {
    flex: 1; background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px; padding: 10px 10px 12px; text-align: center;
  }
  .teamcard.t0 { border-top: 3px solid var(--home); }
  .teamcard.t1 { border-top: 3px solid var(--away); }
  .tname {
    width: 100%; background: transparent; border: none; outline: none;
    font-weight: 800; font-size: 15px; text-align: center; letter-spacing: .08em;
  }
  .t0 .tname, .t0 .score, .t0 .ptbtn { color: var(--home); }
  .t1 .tname, .t1 .score, .t1 .ptbtn { color: var(--away); }
  .score {
    font-size: 72px; font-weight: 900; line-height: 1.05;
    font-variant-numeric: tabular-nums; margin: 2px 0 6px;
  }
  .t0 .score { text-shadow: 0 0 18px rgba(255,178,46,.2); }
  .t1 .score { text-shadow: 0 0 18px rgba(91,200,245,.2); }
  .ptrow { display: flex; gap: 6px; }
  .ptbtn {
    flex: 1; min-height: 58px; font-size: 22px; font-weight: 900;
    border-radius: 12px;
  }
  .t0 .ptbtn { border: 1px solid rgba(255,178,46,.33); background: rgba(255,178,46,.1); }
  .t1 .ptbtn { border: 1px solid rgba(91,200,245,.33); background: rgba(91,200,245,.1); }
  .foulbtn {
    margin-top: 8px; width: 100%; min-height: 40px; border-radius: 10px;
    border: 1px solid var(--line); background: transparent; color: var(--dim);
    font-size: 13px; font-weight: 700;
  }

  #pendingArea { margin-top: 8px; }
  .pendbox { background: var(--panel); border-radius: 12px; padding: 8px 10px; }
  .pendbox.t0 { border: 1px solid rgba(255,178,46,.4); }
  .pendbox.t1 { border: 1px solid rgba(91,200,245,.4); }
  .pendlabel { font-size: 12px; color: var(--dim); margin-bottom: 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    min-width: 52px; min-height: 44px; border-radius: 10px;
    font-weight: 900; font-size: 17px;
  }
  .t0chip { border: 1px solid rgba(255,178,46,.4); background: rgba(255,178,46,.1); color: var(--home); }
  .t1chip { border: 1px solid rgba(91,200,245,.4); background: rgba(91,200,245,.1); color: var(--away); }
  .t0chip.sel { background: var(--home); color: var(--bg); }
  .t1chip.sel { background: var(--away); color: var(--bg); }

  .small {
    border-radius: 10px; border: 1px solid var(--line); background: transparent;
    color: var(--dim); font-size: 12px; font-weight: 700; padding: 6px 10px;
  }
  .small.warn { color: var(--danger); border-color: rgba(229,96,76,.4); }
  /* ★v5修正: 「もう一度で削除」は新しい試合と同じ赤背景で危険度を示す */
  .small.confirm { background: var(--danger); color: #fff; border-color: transparent; }

  .oprow { display: flex; gap: 8px; margin-top: 10px; }
  #undoBtn {
    flex: 2; min-height: 48px; border-radius: 12px; font-weight: 800; font-size: 15px;
    border: 1px solid rgba(229,96,76,.4); background: rgba(229,96,76,.1); color: var(--danger);
  }
  #undoBtn:disabled { background: transparent; color: var(--dim); cursor: default; }
  #csvBtn {
    flex: 1; min-height: 48px; border-radius: 12px; font-weight: 700; font-size: 13px;
    border: 1px solid var(--line); background: var(--panel); color: var(--text);
  }
  #csvBtn:disabled { color: var(--dim); cursor: default; }
  #resetBtn { flex: 1; min-height: 48px; }
  #resetBtn.confirm { background: var(--danger); color: #fff; border-color: transparent; }

  .toggles { display: flex; gap: 8px; margin-top: 8px; }
  .toggles .small { flex: 1; }

  .panelbox {
    margin-top: 8px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 12px;
  }
  .rlabel { font-size: 12px; font-weight: 800; margin-bottom: 4px; }
  .rlabel.t0 { color: var(--home); } .rlabel.t1 { color: var(--away); }
  .rinput {
    width: 100%; background: var(--bg); border: 1px solid var(--line);
    border-radius: 8px; color: var(--text); font-size: 15px; padding: 8px 10px;
    outline: none; margin-bottom: 10px;
  }
  .cliprow { display: flex; align-items: center; gap: 10px;
             border-top: 1px solid var(--line); padding-top: 10px; }
  .clipnote { font-size: 11px; color: var(--dim); margin-top: 6px; line-height: 1.5; }

  .boxwrap { margin-top: 8px; display: flex; gap: 8px; }
  .boxcard { flex: 1; background: var(--panel); border: 1px solid var(--line);
             border-radius: 12px; padding: 10px; }
  .boxhead { display: flex; justify-content: space-between; font-size: 12px;
             font-weight: 800; margin-bottom: 6px; }
  .boxrow { display: flex; justify-content: space-between; font-size: 14px;
            padding: 3px 0; font-variant-numeric: tabular-nums; }
  .boxrow.hot { color: var(--danger); }

  .logwrap { margin-top: 14px; background: var(--panel); border: 1px solid var(--line);
             border-radius: 14px; overflow: hidden; }
  .loghead { display: flex; justify-content: space-between; padding: 8px 12px;
             font-size: 12px; font-weight: 800; letter-spacing: .1em;
             color: var(--dim); border-bottom: 1px solid var(--line); }
  .logbody { max-height: 260px; overflow-y: auto; }
  .logempty { padding: 16px; color: var(--dim); font-size: 13px; }
  .logrow { display: flex; align-items: center; gap: 8px; padding: 8px 12px;
            border-bottom: 1px solid rgba(38,46,58,.33); font-size: 13.5px; cursor: pointer; }
  .logrow.sel0 { background: rgba(255,178,46,.08); }
  .logrow.sel1 { background: rgba(91,200,245,.08); }
  .lclip { color: var(--dim); min-width: 30px; font-size: 11px; }
  .ltime { color: var(--dim); min-width: 44px; font-variant-numeric: tabular-nums; }
  .lq { color: var(--dim); min-width: 22px; font-size: 11px; }
  .lteam { font-weight: 800; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lteam.t0 { color: var(--home); } .lteam.t1 { color: var(--away); }
  .lpts { font-weight: 800; min-width: 56px; text-align: right; }
  .lscore { color: var(--dim); min-width: 52px; text-align: right; font-size: 12px;
            font-variant-numeric: tabular-nums; }
  .footer { text-align: center; margin-top: 12px; font-size: 11px; color: var(--dim); }
  .hidden { display: none; }

  /* ============================================================
     ★v5: かんたんモード(quick mode)
     カメラ取付用。横向き全画面2分割、タップ=得点、長押し=ファウル。
     ============================================================ */
  .modetoggle {
    position: fixed; top: 8px; right: 8px; z-index: 50;
    border-radius: 10px; border: 1px solid var(--line); background: var(--panel);
    color: var(--dim); font-size: 11px; font-weight: 700; padding: 6px 10px;
    opacity: .85;
  }
  /* ★v5修正: かんたんモード中は、画面の隅にあるボタンを大きく・押しやすくする */
  body.quick .modetoggle {
    top: 10px; right: 10px; font-size: 13px; padding: 10px 16px;
    opacity: 1; background: var(--panel); border: 1px solid var(--line);
  }
  body.quick { padding: 0; max-width: none; overflow: hidden; height: 100vh; }
  #quickScreen {
    position: fixed; inset: 0; display: flex; z-index: 40;
    background: var(--bg); -webkit-user-select: none; user-select: none;
  }
  #quickScreen.hidden { display: none; }
  .qzone {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-weight: 900; gap: 6px; position: relative;
    -webkit-tap-highlight-color: transparent;
  }
  .qzone.t0 { background: rgba(255,178,46,.08); color: var(--home); border-right: 1px solid var(--line); }
  .qzone.t1 { background: rgba(91,200,245,.08); color: var(--away); }
  .qzone.flash { filter: brightness(1.6); }
  .qzone .qname { font-size: 22px; letter-spacing: .1em; }
  .qzone .qscore { font-size: 96px; line-height: 1; font-variant-numeric: tabular-nums; }
  .qzone .qscorelabel { font-size: 12px; color: var(--dim); font-weight: 700; margin-top: -8px; }
  .qzone .qhintfixed {
    position: absolute; bottom: 14px; left: 0; right: 0; text-align: center;
    font-size: 12px; color: var(--dim); font-weight: 700; pointer-events: none;
  }
  .qzone .qcount { font-size: 13px; color: var(--dim); font-weight: 700; }
  .qzone .qhint { font-size: 12px; color: var(--dim); font-weight: 700; margin-top: 4px; }
  .qcenter {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    display: flex; flex-direction: column; align-items: center; gap: 10px; z-index: 41;
    pointer-events: none;
  }
  .qclockbtn, .qundobtn, .qwakebtn {
    pointer-events: auto;
    border-radius: 10px; border: 1px solid var(--line); background: var(--panel);
    color: var(--text); font-size: 12px; font-weight: 800; padding: 8px 14px;
    opacity: .9; white-space: nowrap;
  }
  .qundobtn { color: var(--danger); border-color: rgba(229,96,76,.4); }
  .qclockbtn.running { color: var(--home); border-color: var(--home); }
  .qwakebtn.on { color: var(--home); border-color: var(--home); }
  .qfoulflag {
    position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
    font-size: 12px; font-weight: 800; color: var(--danger); pointer-events: none;
  }
</style>
</head>
<body>

<button class="modetoggle" id="modeToggle">▦ かんたん</button>

<div id="quickScreen" class="hidden">
  <div class="qzone t0" id="qzone0">
    <div class="qname" id="qzname0"></div>
    <div class="qscore" id="qzscore0">0</div>
    <div class="qscorelabel">未確定の記録</div>
    <div class="qcount" id="qzcount0"></div>
    <div class="qhintfixed">タップ=得点 ・ 長押し=ファウル</div>
  </div>
  <div class="qzone t1" id="qzone1">
    <div class="qname" id="qzname1"></div>
    <div class="qscore" id="qzscore1">0</div>
    <div class="qscorelabel">未確定の記録</div>
    <div class="qcount" id="qzcount1"></div>
    <div class="qhintfixed">タップ=得点 ・ 長押し=ファウル</div>
  </div>
  <div class="qcenter">
    <button class="qclockbtn" id="qClockBtn"></button>
    <button class="qundobtn" id="qUndoBtn">↩ 直前を取り消す</button>
    <button class="qwakebtn" id="qWakeBtn">画面オフ防止: OFF</button>
  </div>
</div>

<div class="title">
  <div class="title-text">SCORE TRACKER</div>
  <div class="wood"></div>
</div>

<div class="toprow">
  <button id="clockBtn" class="start">▶ 計時開始(RECと同時に)</button>
  <div class="qwrap" id="qwrap"></div>
</div>

<div class="board" id="board"></div>

<div id="pendingArea"></div>

<div class="oprow">
  <button id="undoBtn" disabled>↩ 1つ取り消す</button>
  <button id="csvBtn" disabled>CSV保存</button>
  <button id="resetBtn" class="small">新しい試合</button>
</div>

<div class="toggles">
  <button id="settingsToggle" class="small">▼ 設定(背番号・クリップ)</button>
  <button id="boxToggle" class="small">▼ 選手別集計</button>
</div>

<div id="settingsPanel" class="panelbox hidden">
  <div class="rlabel t0" id="rlabel0"></div>
  <input class="rinput" id="roster0" placeholder="未登録なら選手チップは出ません">
  <div class="rlabel t1" id="rlabel1"></div>
  <input class="rinput" id="roster1" placeholder="未登録なら選手チップは出ません">
  <div class="cliprow">
    <span style="font-size:12px;color:var(--dim);flex:1" id="clipLabel"></span>
    <button class="small" id="clipMinus" style="min-width:44px;min-height:38px;font-size:16px">−</button>
    <button class="small" id="clipPlus" style="min-width:44px;min-height:38px;font-size:16px">＋</button>
  </div>
  <div class="clipnote">
    普段は使いません。RECの押し忘れや誤タップで、アプリの番号と実際の動画ファイル数が
    ズレたときだけ、ここで合わせ直します(ログのC番号=SDカード内の何本目か、を守るため)。
  </div>
</div>

<div id="boxPanel" class="boxwrap hidden"></div>

<div class="logwrap">
  <div class="loghead">
    <span>PLAY-BY-PLAY(新しい順)</span>
    <span style="font-weight:400;letter-spacing:0">行タップで選手を修正</span>
  </div>
  <div class="logbody" id="logBody"></div>
</div>

<div class="footer">データは自動保存されます(この端末・このブラウザ内)</div>

<script>
// ============================================================
// アプリ本体(素のJavaScript版)
// React版との対応:
//   useState の代わりに → state オブジェクト + render関数の手動呼び出し
//   window.storage の代わりに → localStorage(Web標準)
// ============================================================

const QUARTERS = ["Q1", "Q2", "Q3", "Q4", "OT"];
const STORAGE_KEY = "bball_game_v2";

// ---- 状態(アプリが覚えておくデータ) ----
let state = {
  teams: [
    { name: "HOME", score: 0, fouls: 0 },
    { name: "AWAY", score: 0, fouls: 0 },
  ],
  quarter: 0,
  events: [],
  startAt: null,
  clipNo: 0,
  roster: ["", ""],
};
let pendingId = null;     // 選手選択中のイベントID(保存しない一時状態)
let changeTypeOpen = null; // ★v5: 「種別を変更」UIを開いている対象のイベントID
let lastEditedId = null;  // ★v5修正: 直前に編集した行(パネルを閉じてもハイライトを残す)
let deleteConfirmId = null; // ★v5: 削除の二度押し確認対象のイベントID
let deleteConfirmTimer = null;
let deleteConfirmArmedAt = 0; // ★v5修正: 削除確認になった時刻(誤連打防止)
let confirming = null;    // "stop" / "reset" / null
let confirmTimer = null;

// ---- 保存と復元(localStorage = この端末のブラウザ内に保存) ----
function save() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) { console.error("保存に失敗:", e); }
}
function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const d = JSON.parse(raw);
      state = {
        teams: d.teams ?? state.teams,
        quarter: d.quarter ?? 0,
        events: d.events ?? [],
        startAt: d.startAt ?? null,
        clipNo: d.clipNo ?? 0,
        roster: d.roster ?? ["", ""],
      };
    }
  } catch (e) { /* 初回起動は正常 */ }
}

// ---- 小さな道具たち ----
function fmtElapsed(sec) {
  if (sec == null) return "--:--";
  const m = Math.floor(sec / 60), s = sec % 60;
  return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
}
function esc(s) { // HTMLに文字列を埋め込むときの安全化
  return String(s).replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function rosterList(i) {
  return state.roster[i].split(/[,、\s]+/).map(s => s.trim()).filter(Boolean);
}
function accentClass(i) { return i === 0 ? "t0" : "t1"; }

// ---- 二度押し確認 ----
let confirmArmedAt = 0; // ★v5修正: 確認状態になった時刻(直後の誤連打を無視するため)
const CONFIRM_COOLDOWN = 350; // ms。この時間内の2回目クリックはダブルタップとみなして無視

function armConfirm(kind) {
  confirming = kind;
  confirmArmedAt = Date.now();
  clearTimeout(confirmTimer);
  confirmTimer = setTimeout(() => { confirming = null; renderClock(); renderOps(); }, 4000);
}
function disarmConfirm() {
  clearTimeout(confirmTimer);
  confirming = null;
}

// ---- イベント記録 ----
function makeEvent(teamIdx, type, pts, teamsAfter) {
  return {
    id: Date.now() + Math.random(),
    q: QUARTERS[state.quarter],
    team: teamIdx,
    teamName: state.teams[teamIdx].name,
    type, pts,
    player: null,
    clip: state.startAt ? state.clipNo : null,
    elapsed: state.startAt ? Math.floor((Date.now() - state.startAt) / 1000) : null,
    clock: new Date().toLocaleTimeString("ja-JP"),
    scoreLine: teamsAfter[0].score + "-" + teamsAfter[1].score,
  };
}

function addPoints(teamIdx, pts) {
  state.teams[teamIdx].score += pts;
  const e = makeEvent(teamIdx, "score", pts, state.teams);
  state.events.unshift(e);
  pendingId = rosterList(teamIdx).length > 0 ? e.id : null;
  save(); renderAll();
}

function addFoul(teamIdx) {
  state.teams[teamIdx].fouls += 1;
  const e = makeEvent(teamIdx, "foul", 0, state.teams);
  state.events.unshift(e);
  pendingId = rosterList(teamIdx).length > 0 ? e.id : null;
  save(); renderAll();
}

// ★v5: かんたんモードからの記録。
//   得点(quickScore): pts未確定(null)。チームスコアはまだ加算しない
//     → detailモードで点数を確定したとき addPoints と同じ加算処理を行う
//   ファウル(quickFoul): 既存のaddFoulと同じ(数に曖昧さがないため即時加算)
function addQuickScore(teamIdx) {
  const e = makeEvent(teamIdx, "score", null, state.teams);
  e.quick = true; // 未確定の目印(detailモードのpendingで強調表示に使う)
  state.events.unshift(e);
  save();
}
function addQuickFoul(teamIdx) {
  addFoul(teamIdx);
}
// ★v5修正: イベントの種別・点数を変更する汎用関数。
//   未確定(quick)からの確定、確定済みの記録のやり直し、どちらにも対応。
//   古い値をチームの集計から取り消し、新しい値を加算し直すことで、
//   どんな組み合わせの変更(得点⇄ファウル、+2→+3 など)でもスコアの整合性を保つ。

// ★v5修正: イベント1件分の影響(スコア・ファウル数)をチームから取り消す共通処理。
//   changeEventType(種別変更)とdeleteEvent(削除)の両方から使う。
function revertEventEffect(e) {
  const t = state.teams[e.team];
  if (e.type === "score" && e.pts != null) t.score -= e.pts;
  if (e.type === "foul") t.fouls = Math.max(0, t.fouls - 1);
}

function changeEventType(eventId, newType, newPts) {
  const e = state.events.find(ev => ev.id === eventId);
  if (!e) return;
  const t = state.teams[e.team];

  revertEventEffect(e); // 古い値を取り消す

  // 新しい値を反映する
  e.type = newType;
  e.pts = newType === "score" ? newPts : 0;
  e.quick = false;
  if (newType === "score") t.score += newPts;
  else t.fouls += 1;

  e.scoreLine = state.teams[0].score + "-" + state.teams[1].score;
  pendingId = e.id; // 選択状態を維持(どの行を直したか見失わないようにする)
  save(); renderAll();
}
// quick得点を確定(detailモードの+1/+2/+3に相当)
function confirmQuickScore(eventId, pts) { changeEventType(eventId, "score", pts); }
// 未確定の得点を「実はファウルだった」に変更
function convertQuickToFoul(eventId) { changeEventType(eventId, "foul", 0); }

// ★v5修正: 押し間違いなどで「そもそも無かったことにする」削除。
//   スコア・ファウル数への影響を取り消してから、events配列からも除く。
function deleteEvent(eventId) {
  const idx = state.events.findIndex(ev => ev.id === eventId);
  if (idx === -1) return;
  const e = state.events[idx];
  revertEventEffect(e);
  // スコアラインの再計算は不要(削除後の表示は各行が持つscoreLineをそのまま使うため、
  // ここではチーム集計のみ整合させる。以降の新規イベントは正しいscoreLineで記録される)
  state.events.splice(idx, 1);
  pendingId = null;
  changeTypeOpen = null;
  lastEditedId = null;
  save(); renderAll();
}

// ★v5修正: 削除ボタンの二度押し処理。1回目で確認状態、2回目(クールダウン後)で実行。
//   未確定行・確定済み行の両方から呼ばれる共通処理。
function handleDeleteClick(eventId) {
  if (deleteConfirmId !== eventId) {
    deleteConfirmId = eventId;
    deleteConfirmArmedAt = Date.now();
    clearTimeout(deleteConfirmTimer);
    deleteConfirmTimer = setTimeout(() => { deleteConfirmId = null; renderPending(); }, 4000);
    renderPending();
  } else {
    // 確認状態になった直後(ダブルタップ相当)の実行を無視する
    if (Date.now() - deleteConfirmArmedAt < CONFIRM_COOLDOWN) return;
    clearTimeout(deleteConfirmTimer);
    deleteConfirmId = null;
    deleteEvent(eventId);
  }
}

function assignPlayer(num) {
  const e = state.events.find(e => e.id === pendingId);
  if (e) e.player = num;
  lastEditedId = pendingId; // ★v5修正: パネルを閉じてもこの行のハイライトは残す
  pendingId = null;
  changeTypeOpen = null;
  deleteConfirmId = null; clearTimeout(deleteConfirmTimer);
  save(); renderAll();
}

function undo() {
  if (state.events.length === 0) return;
  const last = state.events[0];
  const t = state.teams[last.team];
  if (last.type === "score") {
    if (last.pts != null) t.score -= last.pts; // 確定済みのみスコアを戻す
  } else {
    t.fouls = Math.max(0, t.fouls - 1);
  }
  state.events.shift();
  if (pendingId === last.id) { pendingId = null; changeTypeOpen = null; }
  save(); renderAll();
}

// ---- 計時(REC連動・二度押し確認) ----
function handleClockButton() {
  if (!state.startAt) {
    state.startAt = Date.now();
    state.clipNo += 1;
    disarmConfirm();
  } else if (confirming !== "stop") {
    armConfirm("stop");
  } else {
    // ★v5修正: 確認状態になった直後(ダブルタップ相当)の停止を無視する
    if (Date.now() - confirmArmedAt < CONFIRM_COOLDOWN) return;
    state.startAt = null;
    disarmConfirm();
  }
  save(); renderClock(); renderSettings();
}

function handleResetButton() {
  if (confirming !== "reset") {
    armConfirm("reset");
    renderOps();
    return;
  }
  // ★v5修正: 確認状態になった直後(ダブルタップ相当)の実行を無視する
  if (Date.now() - confirmArmedAt < CONFIRM_COOLDOWN) return;
  state.teams.forEach(t => { t.score = 0; t.fouls = 0; });
  state.quarter = 0;
  state.events = [];
  state.startAt = null;
  state.clipNo = 0;
  pendingId = null;
  changeTypeOpen = null;
  disarmConfirm();
  save(); renderAll();
}

// ---- CSV書き出し ----
function exportCSV() {
  if (state.events.length === 0) return;
  const header = "クリップ,経過時間,時刻,ピリオド,チーム,選手,種別,得点,スコア";
  const rows = [...state.events].reverse().map(e => [
    e.clip ?? "",
    fmtElapsed(e.elapsed),
    e.clock,
    e.q,
    e.teamName,
    e.player ? "#" + e.player : "",
    e.type === "score" ? "得点" : "ファウル",
    e.type === "score" ? (e.pts == null ? "未確定" : "+" + e.pts) : "",
    e.scoreLine,
  ].join(","));
  const blob = new Blob(["\uFEFF" + [header, ...rows].join("\n")],
    { type: "text/csv;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "score_log_" + new Date().toISOString().slice(0, 10) + ".csv";
  a.click();
  URL.revokeObjectURL(url);
}

// ---- 選手別集計 ----
function boxScore(teamIdx) {
  const totals = {};
  for (const e of state.events) {
    if (e.team !== teamIdx || !e.player) continue;
    if (!totals[e.player]) totals[e.player] = { pts: 0, fouls: 0 };
    if (e.type === "score" && e.pts != null) totals[e.player].pts += e.pts;
    if (e.type === "foul") totals[e.player].fouls += 1;
  }
  return Object.entries(totals).sort((a, b) => b[1].pts - a[1].pts);
}

  } else {

}

function renderPending() {
  const area = document.getElementById("pendingArea");
  const e = state.events.find(ev => ev.id === pendingId);
  if (!e) { area.innerHTML = ""; return; }
  const ac = accentClass(e.team);

  // ★v5: 得点が未確定(かんたんモードで記録)の場合 → まず+1/+2/+3を選ぶ
  if (e.type === "score" && e.pts == null) {
    const delLabel = deleteConfirmId === e.id ? "もう一度で削除" : "この記録を削除";
    const delCls = "small warn" + (deleteConfirmId === e.id ? " confirm" : "");
    let inner = '<div class="pendbox ' + ac + '"><div class="pendlabel">' +
      "未確定の記録(" + (e.clip ? "C" + e.clip + " " : "") + fmtElapsed(e.elapsed) + " " +
      esc(e.teamName) + "): 何点?</div>";
    inner += '<div class="chips">';
    [1, 2, 3].forEach(p => {
      inner += '<button class="chip ' + ac + 'chip" data-pts="' + p + '" style="font-size:22px">+' + p + "</button>";
    });
    // ★v5修正: 長押しのつもりがタップになっていた場合の救済(時間・クリップ番号を保ったままファウルへ変換)
    inner += '<button class="small warn" data-act="foul" style="min-height:44px">実はファウル</button>';
    // ★v5: そもそも記録自体が誤りだった場合の削除(二度押し確認)
    inner += '<button class="' + delCls + '" data-act="delete" style="min-height:44px">' + delLabel + '</button>';
    inner += '<button class="small" data-act="close" style="min-height:44px">閉じる</button></div></div>';
    area.innerHTML = inner;
    area.querySelectorAll("[data-pts]").forEach(b =>
      b.onclick = () => confirmQuickScore(e.id, Number(b.dataset.pts)));
    const foulBtn = area.querySelector('[data-act="foul"]');
    if (foulBtn) foulBtn.onclick = () => convertQuickToFoul(e.id);
    const deleteBtn = area.querySelector('[data-act="delete"]');
    if (deleteBtn) deleteBtn.onclick = () => handleDeleteClick(e.id);
    const close = area.querySelector('[data-act="close"]');
    if (close) close.onclick = () => { pendingId = null; deleteConfirmId = null; renderPending(); renderLog(); };
    return;
  }

  const isPast = state.events[0]?.id !== e.id;
  const what = e.type === "score" ? "+" + e.pts : "ファウル";

  // ★v5: 「種別を変更」が開かれている場合 → +1/+2/+3/ファウルの4択を表示
  if (changeTypeOpen === e.id) {
    let inner = '<div class="pendbox ' + ac + '"><div class="pendlabel">' +
      "種別を変更(" + (e.clip ? "C" + e.clip + " " : "") + fmtElapsed(e.elapsed) + " " +
      esc(e.teamName) + " ・ 現在: " + what + ")</div>";
    inner += '<div class="chips">';
    [1, 2, 3].forEach(p => {
      const sel = (e.type === "score" && e.pts === p) ? " sel" : "";
      inner += '<button class="chip ' + ac + 'chip' + sel + '" data-pts="' + p + '" style="font-size:22px">+' + p + "</button>";
    });
    const foulSel = e.type === "foul" ? " sel" : "";
    inner += '<button class="chip ' + ac + 'chip' + foulSel + '" data-act="foul">ファウル</button>';
    inner += '<button class="small" data-act="close" style="min-height:44px">閉じる</button></div></div>';
    area.innerHTML = inner;
    area.querySelectorAll("[data-pts]").forEach(b =>
      b.onclick = () => { changeEventType(e.id, "score", Number(b.dataset.pts)); changeTypeOpen = null; });
    const foulBtn = area.querySelector('[data-act="foul"]');
    if (foulBtn) foulBtn.onclick = () => { changeEventType(e.id, "foul", 0); changeTypeOpen = null; };
    const close = area.querySelector('[data-act="close"]');
    if (close) close.onclick = () => { changeTypeOpen = null; renderPending(); };
    return;
  }

  const label = isPast
    ? "修正中: " + (e.clip ? "C" + e.clip + " " : "") + fmtElapsed(e.elapsed) + " の " + what +
      "(" + esc(e.teamName) + (e.player ? " #" + esc(e.player) : "") + ")"
    : "いまの" + what + "は誰?(あとで直せます・スキップ可)";

  const nums = rosterList(e.team);
  let inner = '<div class="pendbox ' + ac + '"><div class="pendlabel">' + label + "</div>";
  // ★v5: 確定済みの記録を、後から得点⇄ファウルへやり直せるようにする / 削除する
  const delLabel = deleteConfirmId === e.id ? "もう一度で削除" : "この記録を削除";
  const delCls = "small warn" + (deleteConfirmId === e.id ? " confirm" : "");
  inner += '<div style="margin-bottom:8px;display:flex;gap:6px;flex-wrap:wrap">' +
    '<button class="small warn" data-act="changetype">種別を変更(現在: ' + what + ')</button>' +
    '<button class="' + delCls + '" data-act="delete">' + delLabel + '</button>' +
    '</div>';
  if (nums.length === 0) {
    inner += '<div style="font-size:12px;color:var(--dim)">' + esc(e.teamName) +
      " の背番号が未登録です。「▼ 設定」から登録してください。</div>";
  } else {
    inner += '<div class="chips">';
    nums.forEach(n => {
      const sel = e.player === n ? " sel" : "";
      inner += '<button class="chip ' + ac + 'chip' + sel + '" data-num="' + esc(n) + '">#' + esc(n) + "</button>";
    });
    if (e.player) inner += '<button class="small warn" data-act="clear" style="min-height:44px">外す</button>';
    inner += '<button class="small" data-act="close" style="min-height:44px">' +
      (isPast ? "閉じる" : "スキップ") + "</button></div>";
  }
  inner += "</div>";
  area.innerHTML = inner;

  const changeBtn = area.querySelector('[data-act="changetype"]');
  if (changeBtn) changeBtn.onclick = () => {
    changeTypeOpen = e.id;
    deleteConfirmId = null; clearTimeout(deleteConfirmTimer);
    renderPending();
  };

  // ★v5: 削除(二度押し確認。4秒で自動的に確認状態が解除される)
  const deleteBtn = area.querySelector('[data-act="delete"]');
  if (deleteBtn) deleteBtn.onclick = () => handleDeleteClick(e.id);

  area.querySelectorAll(".chip").forEach(b =>
    b.onclick = () => assignPlayer(b.dataset.num));
  const clear = area.querySelector('[data-act="clear"]');
  if (clear) clear.onclick = () => assignPlayer(null);
  const close = area.querySelector('[data-act="close"]');
  if (close) close.onclick = () => { pendingId = null; changeTypeOpen = null; renderPending(); renderLog(); };
}

function renderLog() {
  const body = document.getElementById("logBody");
  if (state.events.length === 0) {
    body.innerHTML = '<div class="logempty">まだ記録がありません。RECと同時に「計時開始」を押すと、' +
      "ログの経過時間がそのクリップの再生位置と一致します。</div>";
    return;
  }
  body.innerHTML = "";
  state.events.forEach(e => {
    const row = document.createElement("div");
    const ac = accentClass(e.team);
    const unresolved = e.type === "score" && e.pts == null; // ★v5: かんたんモードの未確定記録
    // ★v5修正: 「いま操作中(pendingId)」と「直前に編集した(lastEditedId)」を区別せず、
    //   どちらも同じ実線の枠で強調する(分かりやすさのため統一)
    const highlighted = e.id === pendingId || e.id === lastEditedId;
    row.className = "logrow";
    if (unresolved) row.style.background = "rgba(229,96,76,.08)";
    if (highlighted) {
      // ★v5修正: 背景色と競合しないよう、枠線+太字で強調する
      row.style.outline = "2px solid " + (e.team === 0 ? "var(--home)" : "var(--away)");
      row.style.outlineOffset = "-2px";
      row.style.fontWeight = "800";
    }
    row.innerHTML =
      '<span class="lclip">' + (e.clip ? "C" + e.clip : "--") + "</span>" +
      '<span class="ltime">' + fmtElapsed(e.elapsed) + "</span>" +
      '<span class="lq">' + e.q + "</span>" +
      '<span class="lteam ' + ac + '">' + esc(e.teamName) + (e.player ? " #" + esc(e.player) : "") + "</span>" +
      '<span class="lpts"' + (unresolved ? ' style="color:var(--danger)"' : '') + '>' +
        (e.type === "score" ? (unresolved ? "未確定" : "+" + e.pts) : "ファウル") + "</span>" +
      '<span class="lscore">' + e.scoreLine + "</span>";
    row.onclick = () => { pendingId = e.id; changeTypeOpen = null; lastEditedId = null; deleteConfirmId = null; clearTimeout(deleteConfirmTimer); renderPending(); renderLog(); };
    body.appendChild(row);
  });
}

function renderAll() {
  renderClock(); renderQuarters(); renderScores(); renderPending();
  renderOps(); renderSettings(); renderBox(); renderLog();
}

// ============================================================
// ★v5: かんたんモード(quick mode)
// ============================================================
const MODE_KEY = "bball_mode_v1";
let mode = "detail";          // "detail" | "quick"
let modeManual = false;       // 手動切替済みなら向き変化で上書きしない
let wakeLock = null;
let wakeOn = false;
let holdTimer = null;
let holdFired = false;
const HOLD_MS = 500; // 長押し判定(ファウル)

function isLandscape() {
  return window.matchMedia("(orientation: landscape)").matches;
}

function loadMode() {
  try {
    const raw = localStorage.getItem(MODE_KEY);
    if (raw) {
      const d = JSON.parse(raw);
      mode = d.mode ?? mode;
      modeManual = d.manual ?? false;
    }
  } catch (e) { /* なければ向きから決める */ }
  if (!modeManual) mode = isLandscape() ? "quick" : "detail";
}
function saveMode() {
  try { localStorage.setItem(MODE_KEY, JSON.stringify({ mode, manual: modeManual })); }
  catch (e) { /* 保存できなくても動作は継続 */ }
}

function applyMode() {
  const quickScreen = document.getElementById("quickScreen");
  const toggle = document.getElementById("modeToggle");
  if (mode === "quick") {
    document.body.classList.add("quick");
    quickScreen.classList.remove("hidden");
    toggle.textContent = "⊞ 詳細";
    renderQuick();
  } else {
    document.body.classList.remove("quick");
    quickScreen.classList.add("hidden");
    toggle.textContent = "▦ かんたん";
    releaseWakeLock();
    // ★v5: 未確定イベント(quickで記録したpts:null)があれば、一番新しいものを開いて促す
    if (!pendingId) {
      const unresolved = state.events.find(e => e.type === "score" && e.pts == null);
      if (unresolved) pendingId = unresolved.id;
    }
    renderAll();
  }
}

function setMode(next, manual) {
  mode = next;
  if (manual) modeManual = true;
  saveMode();
  applyMode();
}

// 画面の向きが変わったとき: 手動切替していなければ追従する
window.matchMedia("(orientation: landscape)").addEventListener("change", () => {
  if (modeManual) return;
  setMode(isLandscape() ? "quick" : "detail", false);
});

document.getElementById("modeToggle").onclick = (ev) => {
  ev.stopPropagation();
  setMode(mode === "quick" ? "detail" : "quick", true);
};
// ★v5修正: modeToggleの上でのtouch/mouse操作が、背後のqzoneのタップ判定に
//   伝わらないようにする(かんたんモード中、画面隅のボタンが押しにくい問題への対策)
["touchstart", "touchend", "mousedown", "mouseup"].forEach(evt => {
  document.getElementById("modeToggle").addEventListener(evt, (e) => e.stopPropagation());
});
// ★v5修正: 中央の「詳細モードへ」ボタンは誤タップが多いため廃止。
//   右上のmodeToggle(常設・z-indexが高い)で代替する。

// ---- かんたんモードの表示更新 ----
function renderQuick() {
  state.teams.forEach((t, i) => {
    document.getElementById("qzname" + i).textContent = t.name;
    // ★v5修正: 主役の大きい数字は「未確定の記録件数」(=押した回数のカウンター)。
    //   タップした瞬間にこの数字が増えることで、押せたことが一目でわかる。
    const pendingCount = state.events.filter(e => e.team === i && e.type === "score" && e.pts == null).length;
    document.getElementById("qzscore" + i).textContent = pendingCount;
    document.getElementById("qzcount" + i).textContent =
      "確定スコア " + t.score + " ・ ファウル " + t.fouls;
  });
  const clockBtn = document.getElementById("qClockBtn");
  if (state.startAt) {
    const elapsed = Math.floor((Date.now() - state.startAt) / 1000);
    clockBtn.className = "qclockbtn running";
    clockBtn.textContent = "● C" + state.clipNo + " " + fmtElapsed(elapsed);
  } else {
    clockBtn.className = "qclockbtn";
    clockBtn.textContent = "▶ 計時開始";
  }
  document.getElementById("qUndoBtn").style.visibility = state.events.length ? "visible" : "hidden";
}

// ---- かんたんモードのタップ/長押し ----
function flashZone(i) {
  const z = document.getElementById("qzone" + i);
  z.classList.add("flash");
  setTimeout(() => z.classList.remove("flash"), 120);
}

[0, 1].forEach(i => {
  const zone = document.getElementById("qzone" + i);
  let activePointer = null; // "touch" | "mouse" | null (★v5修正: 二重発火防止)

  const start = (kind) => (ev) => {
    if (activePointer) return; // 既に別方式の操作中なら無視
    activePointer = kind;
    ev.preventDefault();
    holdFired = false;
    holdTimer = setTimeout(() => {
      holdFired = true;
      addQuickFoul(i);
      flashZone(i);
      renderQuick();
    }, HOLD_MS);
  };
  const end = (kind) => (ev) => {
    if (activePointer !== kind) return;
    activePointer = null;
    ev.preventDefault();
    clearTimeout(holdTimer);
    if (!holdFired) {
      addQuickScore(i);
      flashZone(i);
      renderQuick();
    }
  };
  const cancel = (kind) => () => {
    if (activePointer !== kind) return;
    activePointer = null;
    clearTimeout(holdTimer);
  };

  zone.addEventListener("touchstart", start("touch"), { passive: false });
  zone.addEventListener("touchend", end("touch"), { passive: false });
  zone.addEventListener("touchcancel", cancel("touch"));
  // マウス操作(Macでの確認用)
  zone.addEventListener("mousedown", start("mouse"));
  zone.addEventListener("mouseup", end("mouse"));
  zone.addEventListener("mouseleave", cancel("mouse"));
});

document.getElementById("qClockBtn").onclick = (ev) => {
  ev.stopPropagation();
  handleClockButton();
  renderQuick();
};
document.getElementById("qUndoBtn").onclick = (ev) => {
  ev.stopPropagation();
  undo();
  renderQuick();
};

// ★v5修正: qcenter内のボタン(計時・取り消し・画面オフ防止)は、
//   背後のqzone(HOME/AWAYタップ判定)へtouch/mouseイベントが伝播すると
//   iOS Safariでclickが発火しなくなる(押しても反応しない)。
//   modeToggleと同様に、qcenter全体でイベント伝播を止める。
["touchstart", "touchend", "mousedown", "mouseup"].forEach(evt => {
  document.querySelector(".qcenter").addEventListener(evt, (e) => e.stopPropagation());
});

// ---- Wake Lock(画面オフ防止) ----
async function requestWakeLock() {
  if (!("wakeLock" in navigator)) {
    alert("このブラウザは画面オフ防止に対応していません。設定アプリで画面ロックの時間を長めにしてください。");
    return;
  }
  try {
    wakeLock = await navigator.wakeLock.request("screen");
    wakeOn = true;
    wakeLock.addEventListener("release", () => {
      wakeOn = false;
      updateWakeBtn();
    });
  } catch (e) {
    wakeOn = false;
    alert("画面オフ防止を開始できませんでした。バッテリー設定によりブロックされる場合があります。");
  }
  updateWakeBtn();
}
function releaseWakeLock() {
  if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
  wakeOn = false;
  updateWakeBtn();
}
function updateWakeBtn() {
  const b = document.getElementById("qWakeBtn");
  if (wakeOn) { b.classList.add("on"); b.textContent = "画面オフ防止: ON"; }
  else { b.classList.remove("on"); b.textContent = "画面オフ防止: OFF"; }
}
document.getElementById("qWakeBtn").onclick = (ev) => {
  ev.stopPropagation();
  if (wakeOn) releaseWakeLock(); else requestWakeLock();
};
// バックグラウンドから復帰した際にWake Lockが切れている場合があるので再取得
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && mode === "quick" && wakeOn && !wakeLock) {
    requestWakeLock();
  }
});

// 1秒ごとにかんたんモードの計時表示も更新
setInterval(() => { if (mode === "quick") renderQuick(); }, 1000);

// ---- 初期化 ----
loadMode();
applyMode();

</script>
